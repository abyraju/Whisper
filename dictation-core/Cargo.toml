[package]
name = "dictation-core"
version = "0.1.0"
edition = "2021"
authors = ["WhisperFlow Team"]
description = "High-performance Rust speech recognition and cascaded dictation engine for Android"

[lib]
name = "dictation_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Serialization & utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# Audio DSP & buffers
hound = "3.5"
rubato = "0.15"

# JNI & FFI bindings
jni = { version = "0.21", default-features = false }

# Optional Sherpa ONNX / ONNX Runtime
# sherpa-onnx-sys or direct onnxruntime bindings
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.10"
