name: Build WhisperFlow Floating APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the obsolete "tools" package that breaks sdkmanager 16.0
          packages: 'platform-tools'

      - name: Install Android platform, build tools and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Checks dependencies against the RustSec advisory database. Reports problems without
      # blocking the build, so a new advisory doesn't stop you producing an APK.
      - name: Audit Rust dependencies
        continue-on-error: true
        working-directory: dictation-core
        run: cargo audit

      - name: Test Rust Core
        working-directory: dictation-core
        run: cargo test --locked

      - name: Compile Rust Core for Android
        run: |
          cd dictation-core
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release
          cargo ndk -t x86_64 -o ../android/app/src/main/jniLibs build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisperflow-floating-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
